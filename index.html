<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewbieFams Laucher</title>
    <link rel="icon" href="https://i.ibb.co.com/1tBC2ngW/Logo-12-F8-F09.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        * {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            box-sizing: border-box;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            background: linear-gradient(to bottom, #8b0000, #330000);
            color: white;
        }

        .swiper {
            width: 100%;
            height: 100%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, auto);
            gap: 20px;
            padding: 50px 20px 20px 20px;
        }

        .app-item {
            text-align: center;
            text-decoration: none;
            color: white;
            display: block;
            transition: opacity 0.2s;
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background-color: #008080;
            border-radius: 18px;
            margin: 0 auto 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-icon {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .label {
            font-size: 12px;
            font-weight: 500;
        }

        .search-bar {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            z-index: 100;
        }

        .search-input {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
            outline: none;
        }

        #search-results {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #8b0000, #330000);
            display: none;
            z-index: 50;
            overflow-y: auto;
            padding-bottom: 120px;
        }

        /* =========================
           TAMPILAN COMING SOON
        ========================= */
        #commingsoon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #8b0000, #330000);
            z-index: 200;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        #commingsoon:target {
            display: flex;
        }

        .cs-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 30px 20px;
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 320px;
            width: 100%;
        }

        .cs-logo {
            width: 80px;
            height: 80px;
            background: #fff;
            border-radius: 20px;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .cs-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .cs-app-name {
            font-size: 14px;
            font-weight: 600;
            color: #ffcc00;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .cs-title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .cs-desc {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .btn-close {
            display: inline-block;
            padding: 10px 25px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>

    <div class="swiper" id="main-swiper">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <div class="grid-container">
                    <a href="../informasi.html" class="app-item">
                        <div class="icon-box" style="background: rgb(255, 255, 255);"><img src="https://i.ibb.co.com/1tBC2ngW/Logo-12-F8-F09.png" class="app-icon"></div>
                        <div class="label">NEWBIEFAMS APPS</div>
                    </a>
                    <a href="#commingsoon" class="app-item">
                        <div class="icon-box" style="background: rgb(255, 255, 255);"><img src="https://i.ibb.co.com/SXDczMbh/SPIN-ICON.png" class="app-icon"></div>
                        <div class="label">SPIN NFxVGQ</div>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div id="search-results">
        <div class="grid-container" id="results-grid"></div>
    </div>

    <div class="search-bar">
        <input type="text" id="searchInput" class="search-input" placeholder="Cari aplikasi...">
    </div>

    <!-- HALAMAN COMING SOON -->
    <div id="commingsoon">
        <div class="cs-card">
            <div class="cs-logo">
                <img id="cs-img" src="https://i.ibb.co.com/1tBC2ngW/Logo-12-F8-F09.png" alt="Logo">
            </div>
            <div class="cs-app-name" id="cs-label">APLIKASI</div>
            <div class="cs-title">SEGERA HADIR</div>
            <div class="cs-desc">Aplikasi ini sedang dalam tahap pengembangan dan akan segera dirilis.</div>
            <a href="#" class="btn-close">Kembali</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        const swiper = new Swiper('.swiper', { loop: false });
        const searchInput = document.getElementById('searchInput');
        const searchResults = document.getElementById('search-results');
        const resultsGrid = document.getElementById('results-grid');
        const allApps = Array.from(document.querySelectorAll('.swiper-slide .app-item'));

        searchInput.addEventListener('input', function () {
            const filter = this.value.toUpperCase();

            if (filter.length > 0) {
                searchResults.style.display = "block";
                resultsGrid.innerHTML = "";

                const filtered = allApps.filter(app =>
                    app.querySelector('.label').textContent.toUpperCase().includes(filter)
                );

                filtered.forEach(app => {
                    const clone = app.cloneNode(true);
                    resultsGrid.appendChild(clone);
                });
            } else {
                searchResults.style.display = "none";
            }
        });

        /* =========================
           DYNAMIC COMING SOON DATA
        ========================= */
        document.addEventListener('click', function(e) {
            const appItem = e.target.closest('a[href="#commingsoon"]');
            if (appItem) {
                const img = appItem.querySelector('img');
                const label = appItem.querySelector('.label');

                if (img) {
                    document.getElementById('cs-img').src = img.src;
                }
                if (label) {
                    document.getElementById('cs-label').textContent = label.textContent;
                }
            }
        });
    </script>
    <script>
        /* =========================
           NEWBIEFAMS PROTECTION
        ========================= */
        (() => {
            document.addEventListener("contextmenu", (e) => e.preventDefault());
            document.addEventListener("dragstart", (e) => {
                if (e.target.tagName === "IMG") e.preventDefault();
            });
            document.querySelectorAll("img").forEach(img => {
                img.setAttribute("draggable", "false");
                img.style.userSelect = "none";
                img.style.webkitUserSelect = "none";
                img.style.webkitTouchCallout = "none";
            });
            document.addEventListener("keydown", function (e) {
                const key = e.key.toLowerCase();
                if (e.key === "F12" || 
                   (e.ctrlKey && e.shiftKey && (key === "i" || key === "j" || key === "c")) ||
                   (e.ctrlKey && (key === "u" || key === "s"))) {
                    e.preventDefault();
                    return false;
                }
            }, true);
            if (window.top !== window.self) document.body.innerHTML = "";
            document.addEventListener("keyup", (e) => {
                if (e.key === "PrintScreen") {
                    document.body.style.transition = ".3s";
                    document.body.style.filter = "blur(20px)";
                    setTimeout(() => document.body.style.filter = "blur(0)", 2000);
                }
            });
            setInterval(() => console.clear(), 2000);
        })();
    </script>
</body>

</html>
